name: Java CI with Gradle

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Start SUT
        run: java -jar "artifacts/app-replan-delivery.jar" &
      - name: Wait for SUT
        run: sleep 10
      - name: Build and test
        run: ./gradlew test